<!--
  The libraries declare font stacks (--ui-font-family / --ui-font-display /
  --ui-font-mono) but deliberately load nothing — loading is the consumer's job
  (ADR-0026, ADR-0035). Storybook is a consumer, so it loads them here.

  Without this the previews silently render the system fallback, which is what
  happened for as long as the stack said Inter: the faces named in the tokens
  were never the faces on screen.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400..600&display=swap"
/>
